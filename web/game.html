<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pill-Guys — Play</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6ff; }
      #controls-hint {
        position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
        font: 600 13px/1.4 "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
        color: #3a4658; background: rgba(255, 255, 255, 0.72);
        padding: 7px 16px; border-radius: 999px; white-space: nowrap;
        box-shadow: 0 4px 14px rgba(16, 36, 63, 0.14);
        user-select: none; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="controls-hint">WASD / arrows to move · Space to jump · R to restart</div>
